<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1811"/><stop offset="1" stop-color="#0e0c09"/>
    </linearGradient>
    <linearGradient id="am" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#f0b544"/>
