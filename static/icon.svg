    <circle cx="130" cy="150" r="9"/><circle cx="178" cy="150" r="9"/><circle cx="226" cy="150" r="9"/>
    <circle cx="274" cy="150" r="9"/><circle cx="322" cy="150" r="9"/><circle cx="370" cy="150" r="9"/>
    <circle cx="130" cy="362" r="9"/><circle cx="178" cy="362" r="9"/><circle cx="226" cy="362" r="9"/>
    <circle cx="274" cy="362" r="9"/><circle cx="322" cy="362" r="9"/><circle cx="370" cy="362" r="9"/>
  </g>
  <!-- M -->
  <text x="256" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="184" font-weight="700" fill="url(#am)">M</text>
